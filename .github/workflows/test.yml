name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pytest
        run: uv run pytest --cov=. --cov-fail-under=95

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run bandit
        run: uv run bandit -r . -x ./.venv,./.git,./__pycache__,./.pytest_cache,./.mypy_cache,./.ruff_cache,./.forgeloop,./tests

      - name: Run pip-audit
        run: uv run pip-audit
