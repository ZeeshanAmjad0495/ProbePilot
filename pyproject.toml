[project]
name = "probepilot"
version = "0.1.0"
description = "Local-first endpoint monitoring tool"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
